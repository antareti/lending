<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAEDALUS — BLACK HOLE MODE</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
overflow-x:hidden;
font-family:Arial, sans-serif;
color:#ff0a2a;
}

/* WATER BACKGROUND */
canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
background:#000;
}

/* SCREENS */
.screen{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:2;
transition:0.6s;
padding: 20px;
}

.hidden{
opacity:0;
pointer-events:none;
transform:scale(1.1);
display: none;
}

/* TEXT */
h1,h2{
font-size: clamp(40px, 8vw, 80px);
text-shadow:0 0 20px #ff0a2a;
text-transform: uppercase;
margin-bottom: 20px;
}

/* BUTTONS */
.btn{
margin-top:20px;
padding:15px 40px;
background:#ff0a2a;
color:white;
text-decoration:none;
border-radius:40px;
font-weight:bold;
border:none;
cursor:pointer;
transition:.3s;
z-index: 10;
}

.btn:hover{
transform:scale(1.1);
box-shadow:0 0 30px #ff0a2a;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));
gap:20px;
margin-top:40px;
width:90%;
max-height: 60vh;
overflow-y: auto;
padding: 10px;
}

/* Стилизация скроллбара для сетки */
.grid::-webkit-scrollbar { width: 5px; }
.grid::-webkit-scrollbar-thumb { background: #ff0a2a; border-radius: 10px; }

.card{
background: rgba(10, 0, 0, 0.8);
border:1px solid #330000;
padding:20px;
border-radius:15px;
text-align:center;
backdrop-filter: blur(5px);
}

.card h3 {
    font-size: 18px;
    margin-bottom: 10px;
    color: #fff;
    text-transform: uppercase;
}

.card p {
    font-size: 12px;
    color: #888;
    margin-bottom: 15px;
}

.card a{
display:inline-block;
padding:10px 20px;
background:#ff0a2a;
color:white;
text-decoration:none;
border-radius:30px;
font-size: 14px;
transition: 0.3s;
}

#status-msg {
    font-family: monospace;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<!-- SCREEN 1: START -->
<div class="screen" id="s1">
<h1>BLACK HOLE</h1>
<p id="status-msg">READY TO INITIALIZE SYSTEM</p>
<button class="btn" onclick="enter()">ENTER SYSTEM</button>
</div>

<!-- SCREEN 2: REPOSITORIES -->
<div class="screen hidden" id="s2">
<h2>REPOSITORIES</h2>
<div class="grid" id="repos-list">
    <!-- Сюда подгрузятся проекты daedalus -->
</div>
<button class="btn" onclick="go4()">FINAL ACCESS</button>
</div>

<!-- SCREEN 4: FINAL -->
<div class="screen hidden" id="s4">
<h2>FINAL ACCESS</h2>
<p style="color: #fff; margin-bottom: 20px;">SYSTEM OPERATIONAL: DAEDALUS</p>
<a class="btn" href="https://t.me/informerhacker_bot">
OPEN TELEGRAM
</a>
</div>

<script>
const USER = 'daedalus';

/* WATER ANIMATION */
const c=document.getElementById("c");
const ctx=c.getContext("2d");
let w,h,t=0;

function resize(){
    w=c.width=window.innerWidth;
    h=c.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

function water(){
    ctx.clearRect(0,0,w,h);
    for(let i=0;i<8;i++){
        ctx.beginPath();
        for(let x=0;x<w;x+=10){
            let y=h/2+Math.sin(x*0.01+t+i)*40;
            ctx.lineTo(x,y+i*20);
        }
        ctx.strokeStyle="rgba(255,10,42,0.25)";
        ctx.lineWidth=1.5;
        ctx.stroke();
    }
    t+=0.03;
    requestAnimationFrame(water);
}
water();

/* GITHUB LOAD FUNCTION */
async function loadRepos() {
    const list = document.getElementById('repos-list');
    const msg = document.getElementById('status-msg');
    
    try {
        msg.innerText = "CONNECTING TO GITHUB API...";
        const response = await fetch(`https://api.github.com/users/${USER}/repos?sort=updated&per_page=50`);
        if (!response.ok) throw new Error();
        const repos = await response.json();

        list.innerHTML = ''; 
        repos.forEach(repo => {
            const lang = repo.language ? repo.language : "Source";
            const card = `
                <div class="card">
                    <h3>${repo.name}</h3>
                    <p>${lang} | Updated: ${new Date(repo.updated_at).toLocaleDateString()}</p>
                    <a href="${repo.html_url}" target="_blank">VIEW CODE</a>
                </div>
            `;
            list.innerHTML += card;
        });
        msg.innerText = "SYSTEM LOADED SUCCESSFULLY";
    } catch (err) {
        msg.innerText = "ERROR: FAILED TO FETCH DATA";
        console.error(err);
    }
}

/* TRANSITIONS */
function switchScreen(hide,show){
    hide.classList.add("hidden");
    show.classList.remove("hidden");
    show.animate([
        { opacity:0, transform:"scale(1.2)", filter:"blur(20px)" },
        { opacity:1, transform:"scale(1)", filter:"blur(0px)" }
    ],{ duration:600, easing:"ease" });
}

function enter(){
    loadRepos(); // Загружаем при входе
    switchScreen(
        document.getElementById("s1"),
        document.getElementById("s2")
    );
}

function go4(){
    switchScreen(
        document.getElementById("s2"),
        document.getElementById("s4")
    );
}

</script>

</body>
</html>
