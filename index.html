<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid UI Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap" rel="stylesheet">

<style>
:root{
--bg:#050000;
--accent:#ff0a2a;
--text:#ff1e3a;
--glass:rgba(255,10,42,0.06);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:Inter;
background:radial-gradient(circle at top,#140000,#050000);
color:var(--text);
overflow-x:hidden;
transition:transform .2s ease-out;
}

/* 🌊 LIQUID LAYER */
.liquid{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
pointer-events:none;
background:
radial-gradient(circle at var(--x,50%) var(--y,50%),
rgba(255,10,42,0.15),
transparent 40%);
filter: blur(40px);
transition: background .15s;
}

/* GLASS NAV */
nav{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
padding:20px 50px;
backdrop-filter:blur(20px);
z-index:10;
}

.logo{font-weight:900}
.logo span{color:var(--accent)}

.btn{
padding:10px 22px;
background:var(--accent);
border-radius:50px;
color:#fff;
font-weight:800;
text-decoration:none;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 0 25px var(--accent);
}

/* HERO */
.hero{
min-height:100vh;
display:flex;
align-items:center;
padding:120px 50px;
position:relative;
z-index:2;
}

.hero h1{
font-size:4rem;
font-weight:900;
text-shadow:0 0 30px rgba(255,10,42,0.2);
}

.hero span{color:var(--accent)}

.cta{
display:inline-block;
margin-top:20px;
padding:16px 40px;
background:var(--accent);
border-radius:50px;
color:#fff;
font-weight:900;
text-decoration:none;
transition:.3s;
}

.cta:hover{
transform:scale(1.08);
box-shadow:0 0 35px var(--accent);
}

/* GLASS CARDS */
section{
padding:100px 50px;
position:relative;
z-index:2;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
}

.card{
background:rgba(255,10,42,0.05);
backdrop-filter:blur(15px);
padding:25px;
border-radius:18px;
border:1px solid rgba(255,10,42,0.2);
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
border-color:var(--accent);
box-shadow:0 10px 40px rgba(255,10,42,0.15);
}
</style>
</head>

<body>

<div class="liquid" id="liquid"></div>

<nav>
<div class="logo">LIQUID <span>PRO</span></div>
<a class="btn" href="https://t.me/+O7F2XX-GnlU4YTJi" target="_blank">Войти</a>
</nav>

<div class="hero">
<div>
<h1>Liquid<br><span>Interface</span></h1>
<p>Интерфейс, который реагирует как вода</p>

<a class="cta" href="https://t.me/+O7F2XX-GnlU4YTJi">🚀 Старт</a>
</div>
</div>

<section>
<h2>Эффекты</h2>

<div class="grid">
<div class="card">🌊 Жидкий фон</div>
<div class="card">🧠 Реакция мыши</div>
<div class="card">💎 Glass UI</div>
</div>
</section>

<script>

/* 🌊 ЖИДКОСТЬ ПОД МЫШЬЮ */
const liquid = document.getElementById("liquid");

document.addEventListener("mousemove",(e)=>{

let x = (e.clientX / window.innerWidth) * 100;
let y = (e.clientY / window.innerHeight) * 100;

liquid.style.setProperty("--x", x + "%");
liquid.style.setProperty("--y", y + "%");

/* мягкое движение всего сайта */
document.body.style.transform =
`translate(${(x-50)*0.02}px, ${(y-50)*0.02}px)`;
});

/* 🌊 микро-волна при движении */
let lastX=0,lastY=0;

document.addEventListener("mousemove",(e)=>{
let dx = e.clientX - lastX;
let dy = e.clientY - lastY;

let speed = Math.min(10, Math.sqrt(dx*dx+dy*dy));

liquid.style.filter = `blur(${40 + speed}px)`;

lastX = e.clientX;
lastY = e.clientY;
});

</script>

</body>
</html>
