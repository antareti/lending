<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid → Snow UI</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Inter;
background:#050000;
overflow:hidden;
color:#ff1e3a;
}

/* ===== CANVAS WATER ===== */
canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
}

/* ===== SCREEN LAYERS ===== */
.screen{
position:absolute;
width:100%;
height:100%;
top:0;
left:0;
transition:1s ease;
}

/* ===== LIQUID SCREEN ===== */
#screen1{
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:10;
}

.title{
font-size:4rem;
font-weight:900;
text-align:center;
text-shadow:0 0 30px rgba(255,10,42,0.3);
}

.btn{
margin-top:30px;
padding:16px 40px;
background:#ff0a2a;
color:#fff;
border-radius:50px;
font-weight:900;
cursor:pointer;
transition:.3s;
border:none;
}

.btn:hover{
transform:scale(1.1);
box-shadow:0 0 30px #ff0a2a;
}

/* ===== WATER FLASH ===== */
.flash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:radial-gradient(circle, rgba(255,10,42,0.4), black);
opacity:0;
z-index:20;
pointer-events:none;
transition:0.6s;
}

/* ===== SCREEN 2 (SNOW SITE) ===== */
#screen2{
opacity:0;
transform:scale(0.95);
filter:blur(10px);
z-index:5;
background:#060000;
padding:50px;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-weight:900;
}

.logo span{color:#ff0a2a}

/* CONTENT */
.hero{
margin-top:80px;
}

.card{
margin-top:20px;
padding:20px;
background:#120000;
border:1px solid #2a0505;
border-radius:15px;
}

/* ===== SNOW ===== */
.snow{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
z-index:6;
opacity:0;
transition:1s;
}

.snowflake{
position:absolute;
top:-10px;
width:4px;
height:4px;
background:#ff0a2a;
border-radius:50%;
animation:fall linear infinite;
}

@keyframes fall{
to{
transform:translateY(110vh);
opacity:0;
}
}
</style>
</head>

<body>

<canvas id="water"></canvas>
<div class="flash" id="flash"></div>

<!-- ❄️ SNOW LAYER -->
<div class="snow" id="snow"></div>

<!-- 🌊 SCREEN 1 -->
<div class="screen" id="screen1">

<div>
<div class="title">LIQUID<br>SYSTEM</div>
<button class="btn" onclick="enter()">ENTER</button>
</div>

</div>

<!-- ❄️ SCREEN 2 -->
<div class="screen" id="screen2">

<nav>
<div class="logo">ТОННЕЛЬ <span>PRO</span></div>
</nav>

<div class="hero">
<h2>Система роста</h2>

<div class="card">Фокус</div>
<div class="card">Система</div>
<div class="card">Рост</div>
</div>

</div>

<script>

/* ================= WATER ANIMATION ================= */
const canvas = document.getElementById("water");
const ctx = canvas.getContext("2d");

let w,h,t=0;

function resize(){
w=canvas.width=window.innerWidth;
h=canvas.height=window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

function wave(){

ctx.clearRect(0,0,w,h);

for(let i=0;i<6;i++){
ctx.beginPath();

for(let x=0;x<w;x+=10){
let y =
h/2 +
Math.sin(x*0.01 + t + i)*40 +
Math.cos(x*0.02 + t)*20;

ctx.lineTo(x,y+i*30);
}

ctx.strokeStyle=`rgba(255,10,42,${0.1})`;
ctx.stroke();
}

t+=0.03;
requestAnimationFrame(wave);
}
wave();

/* ================= SNOW ================= */
const snow=document.getElementById("snow");

function drop(){
const s=document.createElement("div");
s.className="snowflake";
s.style.left=Math.random()*100+"vw";
s.style.animationDuration=(Math.random()*5+3)+"s";
snow.appendChild(s);
setTimeout(()=>s.remove(),8000);
}

/* ================= TRANSITION ================= */
function enter(){

const screen1=document.getElementById("screen1");
const screen2=document.getElementById("screen2");
const flash=document.getElementById("flash");

/* WATER FLASH */
flash.style.opacity=1;

/* screen1 exit */
screen1.style.transform="scale(1.1)";
screen1.style.filter="blur(20px)";
screen1.style.opacity=0;

/* screen2 enter */
setTimeout(()=>{
screen2.style.opacity=1;
screen2.style.transform="scale(1)";
screen2.style.filter="blur(0px)";
},400);

/* turn on snow AFTER transition */
setTimeout(()=>{
snow.style.opacity=1;
setInterval(drop,60);
},900);

/* cleanup flash */
setTimeout(()=>{
flash.style.opacity=0;
screen1.style.display="none";
},800);
}

</script>

</body>
</html>
