<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid System</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600;900&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Inter;
background:#050000;
overflow:hidden;
color:#ff1e3a;
}

/* ===== CANVAS WATER ===== */
canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:0;
}

/* ===== FLASH ===== */
.flash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:radial-gradient(circle, rgba(255,10,42,0.4), black);
opacity:0;
z-index:20;
pointer-events:none;
transition:0.6s;
}

/* ===== SNOW ===== */
.snow{
position:fixed;
width:100%;
height:100%;
pointer-events:none;
z-index:6;
opacity:0;
transition:1s;
}

.snowflake{
position:absolute;
top:-10px;
width:4px;
height:4px;
background:#ff0a2a;
border-radius:50%;
animation:fall linear infinite;
}

@keyframes fall{
to{transform:translateY(110vh);opacity:0}
}

/* ===== SCREENS ===== */
.screen{
position:absolute;
width:100%;
height:100%;
top:0;
left:0;
transition:1s ease;
}

/* ===== SCREEN 1 ===== */
#screen1{
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
z-index:10;
}

.title{
font-size:4rem;
font-weight:900;
text-align:center;
}

.btn{
margin-top:30px;
padding:16px 40px;
background:#ff0a2a;
color:#fff;
border-radius:50px;
font-weight:900;
cursor:pointer;
border:none;
transition:.3s;
}

.btn:hover{
transform:scale(1.1);
box-shadow:0 0 30px #ff0a2a;
}

/* ===== SCREEN 2 ===== */
#screen2{
opacity:0;
transform:scale(0.95);
filter:blur(10px);
background:#060000;
padding:40px;
z-index:5;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-weight:900;
}

.logo span{color:#ff0a2a}

.btn-small{
padding:8px 18px;
background:#ff0a2a;
color:white;
border-radius:50px;
text-decoration:none;
font-weight:900;
}

/* HERO */
.hero{
margin-top:60px;
}

.hero h2{
font-size:2.5rem;
}

.hero p{
color:#8a2a2a;
margin-top:10px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-top:40px;
}

.card{
background:#120000;
border:1px solid #2a0505;
padding:25px;
border-radius:15px;
transition:.3s;
}

.card:hover{
transform:translateY(-10px);
border-color:#ff0a2a;
box-shadow:0 10px 40px rgba(255,10,42,0.2);
}

.card h3{margin-bottom:10px}

.card p{
color:#8a2a2a;
font-size:14px;
}

.card a{
display:inline-block;
margin-top:15px;
padding:10px 18px;
background:#ff0a2a;
color:white;
border-radius:50px;
text-decoration:none;
font-weight:900;
transition:.3s;
}

.card a:hover{
transform:scale(1.1);
box-shadow:0 0 25px #ff0a2a;
}

/* FINAL */
.final{
text-align:center;
margin-top:60px;
}

.big-btn{
display:inline-block;
padding:18px 60px;
background:#ff0a2a;
color:white;
border-radius:50px;
font-weight:900;
text-decoration:none;
}
</style>
</head>

<body>

<div class="flash" id="flash"></div>
<div class="snow" id="snow"></div>

<canvas id="water"></canvas>

<!-- SCREEN 1 -->
<div class="screen" id="screen1">

<div>
<div class="title">LIQUID<br>SYSTEM</div>
<button class="btn" onclick="enter()">ENTER</button>
</div>

</div>

<!-- SCREEN 2 -->
<div class="screen" id="screen2">

<nav>
<div class="logo">ТОННЕЛЬ <span>PRO</span></div>
<a class="btn-small" href="https://t.me/+O7F2XX-GnlU4YTJi">Войти</a>
</nav>

<div class="hero">
<h2>Система роста</h2>
<p>Действие → результат → рост</p>

<div class="grid">

<div class="card">
<h3>Фокус</h3>
<p>Убираешь шум и лишнее</p>
<a href="https://t.me/+O7F2XX-GnlU4YTJi">Подробнее</a>
</div>

<div class="card">
<h3>Система</h3>
<p>Чёткий план действий</p>
<a href="https://t.me/+O7F2XX-GnlU4YTJi">Подробнее</a>
</div>

<div class="card">
<h3>Рост</h3>
<p>Реальный прогресс</p>
<a href="https://t.me/+O7F2XX-GnlU4YTJi">Подробнее</a>
</div>

</div>

<div class="final">
<a class="big-btn" href="https://t.me/+O7F2XX-GnlU4YTJi">⚡ Войти в систему</a>
</div>

</div>

</div>

<script>

/* ===== WATER ===== */
const canvas=document.getElementById("water");
const ctx=canvas.getContext("2d");

let w,h,t=0;

function resize(){
w=canvas.width=innerWidth;
h=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

function wave(){
ctx.clearRect(0,0,w,h);

for(let i=0;i<6;i++){
ctx.beginPath();
for(let x=0;x<w;x+=10){
let y=h/2+Math.sin(x*0.01+t+i)*40;
ctx.lineTo(x,y+i*25);
}
ctx.strokeStyle="rgba(255,10,42,0.12)";
ctx.stroke();
}

t+=0.03;
requestAnimationFrame(wave);
}
wave();

/* ===== SNOW ===== */
const snow=document.getElementById("snow");

function drop(){
const s=document.createElement("div");
s.className="snowflake";
s.style.left=Math.random()*100+"vw";
s.style.animationDuration=(Math.random()*5+3)+"s";
snow.appendChild(s);
setTimeout(()=>s.remove(),8000);
}

/* ===== TRANSITION ===== */
function enter(){

const s1=document.getElementById("screen1");
const s2=document.getElementById("screen2");
const flash=document.getElementById("flash");

/* water flash */
flash.style.opacity=1;

/* exit screen1 */
s1.style.opacity=0;
s1.style.transform="scale(1.1)";
s1.style.filter="blur(20px)";

/* enter screen2 */
setTimeout(()=>{
s2.style.opacity=1;
s2.style.transform="scale(1)";
s2.style.filter="blur(0px)";
},400);

/* start snow */
setTimeout(()=>{
snow.style.opacity=1;
setInterval(drop,60);
},900);

/* cleanup */
setTimeout(()=>{
flash.style.opacity=0;
s1.style.display="none";
},800);

}

</script>

</body>
</html>
